[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # Stub modules pre-declare imports needed for future phase implementations.
    # Re-enable F401 once phases 2–4 are complete.
    "F401",
    # Docstrings are intentionally detailed; long lines are acceptable.
    "E501",
]

[tool.ruff.lint.isort]
# Tell ruff that `pipeline` is a first-party (local) module so it
# correctly separates it from third-party imports like ee/sklearn/numpy.
known-first-party = ["pipeline"]
